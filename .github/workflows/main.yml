name: Build Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10"
      - name: Build
        run: gradle build --no-daemon --project-dir rivalspawnchain
      - uses: actions/upload-artifact@v4
        with:
          name: rivalspawnchain-jar
          path: rivalspawnchain/build/libs/rivalspawnchain-*.jar
